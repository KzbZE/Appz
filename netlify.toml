[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
  # Désactiver le scan de secrets pour les clés API publiques frontend
  # Ces clés DOIVENT être dans le bundle compilé pour fonctionner
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSy"
